<script>
document.addEventListener('DOMContentLoaded', function() {
    const items = document.querySelectorAll('.portfolio_item');
    const popup = document.getElementById('portfolioPopup');
    const overlay = document.getElementById('popupOverlay');
    const close = document.getElementById('popupClose');
    const mainImg = document.getElementById('popupMainImage');
    const prev = document.getElementById('popupPrev');
    const next = document.getElementById('popupNext');
    const current = document.getElementById('currentImage');
    const total = document.getElementById('totalImages');
    
    let currentIndex = 0;
    const images = [];
    const texts = ['Хаан банк', 'Сонгдо хотхон', 'ТДБ банк', 'Ривер тауэр', 'Шинэ төсөл', 'Тайм сквер'];
    
    // Collect images
    items.forEach(item => {
        const img = item.querySelector('img');
        images.push(img.src);
    });
    
    total.textContent = images.length;
    
    // Show image
    function showImage(index) {
        currentIndex = index;
        mainImg.src = images[currentIndex];
        current.textContent = currentIndex + 1;
        document.getElementById('popupText').textContent = texts[currentIndex] || '';
    }
    
    // Open popup
    items.forEach((item, index) => {
        item.addEventListener('click', () => {
            showImage(index);
            popup.style.display = 'block';
        });
    });
    
    // Close popup
    function closePopup() {
        popup.style.display = 'none';
    }
    
    close.addEventListener('click', closePopup);
    overlay.addEventListener('click', closePopup);
    
    // Navigation
    prev.addEventListener('click', () => {
        if (currentIndex > 0) showImage(currentIndex - 1);
    });
    
    next.addEventListener('click', () => {
        if (currentIndex < images.length - 1) showImage(currentIndex + 1);
    });
    
    // Keyboard
    document.addEventListener('keydown', (e) => {
        if (popup.style.display === 'block') {
            if (e.key === 'Escape') closePopup();
            if (e.key === 'ArrowLeft' && currentIndex > 0) showImage(currentIndex - 1);
            if (e.key === 'ArrowRight' && currentIndex < images.length - 1) showImage(currentIndex + 1);
        }
    });
});
</script>

<style>
.portfolio_popup {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 9999;
}
.popup_overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
}
.popup_content {
    position: relative;
    width: 90%;
    height: 90%;
    margin: 5% auto;
    background: white;
    border-radius: 10px;
    padding: 20px;
}
.popup_close {
    position: absolute;
    top: 10px;
    right: 10px;
    background: none;
    border: none;
    font-size: 24px;
    cursor: pointer;
}
.popup_main_image {
    text-align: center;
    height: 80%;
}
.popup_main_image img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}
.popup_nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.5);
    color: white;
    border: none;
    padding: 10px;
    cursor: pointer;
}
.popup_prev { left: 10px; }
.popup_next { right: 10px; }
.popup_counter {
    text-align: center;
    margin-top: 10px;
    font-weight: bold;
}
.popup_text {
    text-align: center;
    margin-top: 10px;
    font-size: 18px;
    color: #333;
}
.portfolio_item {
    cursor: pointer;
}
</style>
