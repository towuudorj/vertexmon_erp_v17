<style>
.prev-btn, .next-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.5);
    color: white;
    border: none;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
    z-index: 10;
}
.prev-btn {
    left: 20px;
}
.next-btn {
    right: 20px;
}
.prev-btn:hover, .next-btn:hover {
    background: rgba(0,0,0,0.8);
}
.certificates_vertical_scroller {
    position: relative;
}
.scroller_track {
    display: flex;
    flex-wrap: wrap;
}
.certificate_document {
    width: 25%;
    padding: 10px;
}
</style>

<script>
window.currentSlide = 1;
window.autoSlideInterval = null;

window.nextSlide = function() {
    const slides = document.querySelectorAll('.certificate_document');
    const maxSlide = Math.ceil(slides.length / 4);
    if (window.currentSlide >= maxSlide) {
        window.currentSlide = 1;
    } else {
        window.currentSlide++;
    }
    window.showSlide();
};

window.prevSlide = function() {
    if (window.currentSlide > 1) window.currentSlide--;
    window.showSlide();
};

window.showSlide = function() {
    const slides = document.querySelectorAll('.certificate_document');
    slides.forEach((slide, index) => {
        const start = (window.currentSlide - 1) * 4;
        slide.style.display = (index >= start && index < start + 4) ? 'block' : 'none';
    });
};

window.startAutoSlide = function() {
    window.autoSlideInterval = setInterval(window.nextSlide, 3000);
};

window.stopAutoSlide = function() {
    clearInterval(window.autoSlideInterval);
};

document.addEventListener('DOMContentLoaded', function() {
    window.showSlide();
    window.startAutoSlide();
    
    // Pause on hover
    const slider = document.querySelector('.certificates_vertical_scroller');
    slider.addEventListener('mouseenter', window.stopAutoSlide);
    slider.addEventListener('mouseleave', window.startAutoSlide);
});
</script>
